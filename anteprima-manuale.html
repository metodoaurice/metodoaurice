
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURICE™ | Manuale e Starter Kit</title>
  <style>
    :root {
      --nero: #080808;
      --oro: #c89b4b;
      --bianco: #f5f3ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--nero);
      color: var(--bianco);
      font-family: Georgia, serif;
    }

    header {
      padding: 28px 6%;
      border-bottom: 1px solid var(--oro);
      text-align: center;
    }

    .marchio {
      color: var(--oro);
      font-size: 32px;
      letter-spacing: 7px;
    }

    .motto {
      color: var(--oro);
      font-size: 13px;
      margin-top: 8px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 60px 24px;
    }
  </style>
</head>
<body>

<header>
  <div class="marchio">AURICE™</div>
  <div class="motto">Designed to simplify life.</div>
</header>

<main>
  
<section style="text-align:center; padding:45px 0 70px;">

  <p style="color:#c89b4b; letter-spacing:4px;">
    IL MANUALE AURICE™
  </p>

  <h1 style="font-size:clamp(36px,6vw,68px);
             font-style:italic;
             font-weight:normal;
             margin:25px 0;">
    So da dove cominciare.
  </h1>

  <div style="width:130px;
              height:2px;
              background:#c89b4b;
              margin:30px auto;">
  </div>

  <p style="font-size:20px;
            line-height:1.8;
            max-width:750px;
            margin:30px auto;">
    Un metodo operativo per accompagnare
    lo studente passo dopo passo nello studio,
    nell'organizzazione e nella costruzione
    della propria autonomia.
  </p>

  <p style="color:#c89b4b; margin-top:35px;">
    METODO · ORGANIZZAZIONE · AUTONOMIA
  </p>

</section>

</main>

</body>
</html>
